<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" viewBox="0 0 640 540"><title>Illustrative demo: a customer finds a business, reads its service page and sends an enquiry</title><defs><filter id="sh" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#1d1a3d" flood-opacity=".14" stdDeviation="12"/></filter><linearGradient id="bgg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#efecfd"/><stop offset="1" stop-color="#e4f5f7"/></linearGradient></defs><rect width="624" height="524" x="8" y="8" fill="url(#bgg)" rx="28"/><path fill="none" stroke="#5b3fd9" stroke-dasharray="6 7" stroke-linecap="round" stroke-width="2.5" d="M240 210 C 240 244, 262 252, 290 256 M 352 348 C 352 392, 330 408, 294 410" opacity=".55"/><g filter="url(#sh)"><rect width="270" height="168" x="34" y="40" fill="#fff" rx="16"/></g><rect width="238" height="30" x="50" y="56" fill="#f1efea" rx="15"/><circle cx="68" cy="71" r="6" fill="none" stroke="#565d75" stroke-width="2"/><path stroke="#565d75" stroke-linecap="round" stroke-width="2" d="M72.5 75.5l4 4"/><text x="84" y="76" fill="#14172a" font-size="12.5">opticians near me</text><text x="50" y="112" fill="#14172a" font-size="15" font-weight="700">Kaveri Opticals</text><text x="50" y="131" fill="#565d75" font-size="11.5">Eye tests · frames · lenses · 1.2 km</text><circle cx="54" cy="147" r="3.5" fill="#12795b"/><text x="63" y="151" fill="#12795b" font-size="11.5" font-weight="600">Open until 8 pm</text><g font-size="11" font-weight="600"><rect width="66" height="26" x="50" y="166" fill="#5b3fd9" rx="13"/><text x="83" y="183" fill="#fff" text-anchor="middle">Call</text><rect width="82" height="26" x="122" y="166" fill="#efecfd" rx="13"/><text x="163" y="183" fill="#4a31bd" text-anchor="middle">Directions</text><rect width="78" height="26" x="210" y="166" fill="#efecfd" rx="13"/><text x="249" y="183" fill="#4a31bd" text-anchor="middle">Website</text></g><g><circle cx="304" cy="40" r="17" fill="#5b3fd9"/><text x="304" y="45.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text></g><text x="34" y="230" fill="#565d75" font-size="12.5"><tspan fill="#1d1a3d" font-weight="700">Found</tspan> — name, hours, actions</text><g filter="url(#sh)"><rect width="312" height="214" x="292" y="132" fill="#fff" rx="16"/></g><rect width="312" height="44" x="292" y="132" fill="#1d1a3d" rx="16"/><rect width="312" height="16" x="292" y="160" fill="#1d1a3d"/><text x="310" y="159" fill="#fff" font-size="13" font-weight="700">Kaveri Opticals</text><text x="586" y="159" fill="#cfcaf0" font-size="11" text-anchor="end">Services · Visit · Contact</text><text x="310" y="202" fill="#14172a" font-size="15" font-weight="700">Eye tests and glasses, explained</text><g fill="#14172a" font-size="12"><rect width="276" height="34" x="310" y="214" fill="#f7f6f3" rx="9"/><text x="324" y="235">Eye test</text><text x="572" y="235" fill="#565d75" text-anchor="end">20 minutes</text><rect width="276" height="34" x="310" y="254" fill="#f7f6f3" rx="9"/><text x="324" y="275">Frames and lenses</text><text x="572" y="275" fill="#565d75" text-anchor="end">Ready in 2–3 days</text></g><rect width="164" height="30" x="310" y="300" fill="#0e7c8c" rx="15"/><text x="392" y="319.5" fill="#fff" font-size="11.5" font-weight="600" text-anchor="middle">Ask a question</text><text x="486" y="319.5" fill="#565d75" font-size="11">Mon–Sat, 10–8</text><g><circle cx="604" cy="132" r="17" fill="#5b3fd9"/><text x="604" y="137.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text></g><text x="604" y="368" fill="#565d75" font-size="12.5" text-anchor="end"><tspan fill="#1d1a3d" font-weight="700">Understood</tspan> — what, how long, when</text><g filter="url(#sh)"><rect width="258" height="196" x="34" y="300" fill="#fff" rx="16"/></g><text x="52" y="330" fill="#14172a" font-size="14" font-weight="700">Request an eye test</text><g fill="#565d75" font-size="11"><text x="52" y="352">Preferred day</text><rect width="106" height="28" x="52" y="358" fill="#f7f6f3" stroke="#e4e1da" rx="8"/><text x="62" y="376" fill="#14172a">Saturday</text><text x="168" y="352">Time</text><rect width="106" height="28" x="168" y="358" fill="#f7f6f3" stroke="#e4e1da" rx="8"/><text x="178" y="376" fill="#14172a">Morning</text></g><rect width="222" height="58" x="52" y="398" fill="#e5f3ee" rx="10"/><circle cx="70" cy="418" r="8" fill="#12795b"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M66 418l3 3 5-6"/><text x="86" y="422" fill="#12795b" font-size="12" font-weight="700">Request sent</text><text x="66" y="443" fill="#14172a" font-size="10.5">The shop confirms your time on WhatsApp.</text><text x="52" y="478" fill="#565d75" font-size="10.5">A request, not a confirmed booking.</text><g><circle cx="292" cy="300" r="17" fill="#5b3fd9"/><text x="292" y="305.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text></g><text x="312" y="446" fill="#565d75" font-size="12.5"><tspan fill="#1d1a3d" font-weight="700">Contacted</tspan> — one clear next step</text><rect width="160" height="28" x="452" y="488" fill="#1d1a3d" rx="14"/><text x="532" y="506.5" fill="#fff" font-size="11.5" font-weight="700" letter-spacing=".4" text-anchor="middle">ILLUSTRATIVE DEMO</text></svg>