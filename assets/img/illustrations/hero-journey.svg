<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>Illustrative demo: a customer finds a business, reads its service page and sends an enquiry</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1d1a3d" flood-opacity=".14"/></filter>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efecfd"/><stop offset="1" stop-color="#e4f5f7"/></linearGradient>
  </defs>
  <rect x="8" y="8" width="624" height="524" rx="28" fill="url(#bgg)"/>
  <!-- journey line -->
  <path d="M240 210 C 240 244, 262 252, 290 256 M 352 348 C 352 392, 330 408, 294 410" fill="none" stroke="#5b3fd9" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round" opacity=".55"/>

  <!-- 1. found: search result card -->
  <g filter="url(#sh)">
    <rect x="34" y="40" width="270" height="168" rx="16" fill="#fff"/>
  </g>
  <rect x="50" y="56" width="238" height="30" rx="15" fill="#f1efea"/>
  <circle cx="68" cy="71" r="6" fill="none" stroke="#565d75" stroke-width="2"/><path d="M72.5 75.5l4 4" stroke="#565d75" stroke-width="2" stroke-linecap="round"/>
  <text x="84" y="76" font-size="12.5" fill="#14172a">opticians near me</text>
  <text x="50" y="112" font-size="15" font-weight="700" fill="#14172a">Kaveri Opticals</text>
  <text x="50" y="131" font-size="11.5" fill="#565d75">Eye tests · frames · lenses · 1.2 km</text>
  <circle cx="54" cy="147" r="3.5" fill="#12795b"/><text x="63" y="151" font-size="11.5" fill="#12795b" font-weight="600">Open until 8 pm</text>
  <g font-size="11" font-weight="600">
    <rect x="50" y="166" width="66" height="26" rx="13" fill="#5b3fd9"/><text x="83" y="183" fill="#fff" text-anchor="middle">Call</text>
    <rect x="122" y="166" width="82" height="26" rx="13" fill="#efecfd"/><text x="163" y="183" fill="#4a31bd" text-anchor="middle">Directions</text>
    <rect x="210" y="166" width="78" height="26" rx="13" fill="#efecfd"/><text x="249" y="183" fill="#4a31bd" text-anchor="middle">Website</text>
  </g>
  <g><circle cx="304" cy="40" r="17" fill="#5b3fd9"/><text x="304" y="45.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text></g>
  <text x="34" y="230" font-size="12.5" fill="#565d75"><tspan font-weight="700" fill="#1d1a3d">Found</tspan> — name, hours, actions</text>

  <!-- 2. understood: service page -->
  <g filter="url(#sh)">
    <rect x="292" y="132" width="312" height="214" rx="16" fill="#fff"/>
  </g>
  <rect x="292" y="132" width="312" height="44" rx="16" fill="#1d1a3d"/><rect x="292" y="160" width="312" height="16" fill="#1d1a3d"/>
  <text x="310" y="159" font-size="13" font-weight="700" fill="#fff">Kaveri Opticals</text>
  <text x="586" y="159" font-size="11" fill="#cfcaf0" text-anchor="end">Services · Visit · Contact</text>
  <text x="310" y="202" font-size="15" font-weight="700" fill="#14172a">Eye tests and glasses, explained</text>
  <g font-size="12" fill="#14172a">
    <rect x="310" y="214" width="276" height="34" rx="9" fill="#f7f6f3"/><text x="324" y="235">Eye test</text><text x="572" y="235" fill="#565d75" text-anchor="end">20 minutes</text>
    <rect x="310" y="254" width="276" height="34" rx="9" fill="#f7f6f3"/><text x="324" y="275">Frames and lenses</text><text x="572" y="275" fill="#565d75" text-anchor="end">Ready in 2–3 days</text>
  </g>
  <rect x="310" y="300" width="164" height="30" rx="15" fill="#0e7c8c"/><text x="392" y="319.5" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Ask a question</text>
  <text x="486" y="319.5" font-size="11" fill="#565d75">Mon–Sat, 10–8</text>
  <g><circle cx="604" cy="132" r="17" fill="#5b3fd9"/><text x="604" y="137.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text></g>
  <text x="604" y="368" font-size="12.5" fill="#565d75" text-anchor="end"><tspan font-weight="700" fill="#1d1a3d">Understood</tspan> — what, how long, when</text>

  <!-- 3. contacted: enquiry handoff -->
  <g filter="url(#sh)">
    <rect x="34" y="300" width="258" height="196" rx="16" fill="#fff"/>
  </g>
  <text x="52" y="330" font-size="14" font-weight="700" fill="#14172a">Request an eye test</text>
  <g font-size="11" fill="#565d75">
    <text x="52" y="352">Preferred day</text>
    <rect x="52" y="358" width="106" height="28" rx="8" fill="#f7f6f3" stroke="#e4e1da"/><text x="62" y="376" fill="#14172a">Saturday</text>
    <text x="168" y="352">Time</text>
    <rect x="168" y="358" width="106" height="28" rx="8" fill="#f7f6f3" stroke="#e4e1da"/><text x="178" y="376" fill="#14172a">Morning</text>
  </g>
  <rect x="52" y="398" width="222" height="58" rx="10" fill="#e5f3ee"/>
  <circle cx="70" cy="418" r="8" fill="#12795b"/><path d="M66 418l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="422" font-size="12" font-weight="700" fill="#12795b">Request sent</text>
  <text x="66" y="443" font-size="10.5" fill="#14172a">The shop confirms your time on WhatsApp.</text>
  <text x="52" y="478" font-size="10.5" fill="#565d75">A request, not a confirmed booking.</text>
  <g><circle cx="292" cy="300" r="17" fill="#5b3fd9"/><text x="292" y="305.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text></g>
  <text x="312" y="446" font-size="12.5" fill="#565d75"><tspan font-weight="700" fill="#1d1a3d">Contacted</tspan> — one clear next step</text>

  <!-- label -->
  <rect x="452" y="488" width="160" height="28" rx="14" fill="#1d1a3d"/>
  <text x="532" y="506.5" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing=".4">ILLUSTRATIVE DEMO</text>
</svg>
