<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" viewBox="0 0 400 640"><title>Concept demo, after: a clear mobile page for a fictional hardware shop with hours, catalogue and WhatsApp enquiry</title><rect width="400" height="640" fill="#f7f6f3" rx="24"/><rect width="368" height="30" x="16" y="14" fill="#fff" stroke="#e4e1da" rx="15"/><text x="200" y="34" fill="#565d75" font-size="11.5" text-anchor="middle">anand-hardware.example</text><rect width="368" height="112" x="16" y="56" fill="#1d1a3d" rx="16"/><rect width="40" height="40" x="32" y="72" fill="#d95f1e" rx="10"/><text x="52" y="99" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">A</text><text x="84" y="88" fill="#fff" font-size="16" font-weight="700">Anand Hardware &amp; Paints</text><text x="84" y="107" fill="#cfcaf0" font-size="11.5">Near Rajwada, Indore · since 1998</text><circle cx="38" cy="140" r="4" fill="#4ade80"/><text x="48" y="144" fill="#fff" font-size="12" font-weight="600">Open today · 9:30 am – 8:30 pm</text><g font-size="12.5" font-weight="700" text-anchor="middle"><rect width="160" height="42" x="16" y="180" fill="#0e7a35" rx="21"/><text x="96" y="205.5" fill="#fff">WhatsApp us</text><rect width="96" height="42" x="184" y="180" fill="#fff" stroke="#cfcaf0" rx="21"/><text x="232" y="205.5" fill="#4a31bd">Call</text><rect width="96" height="42" x="288" y="180" fill="#fff" stroke="#cfcaf0" rx="21"/><text x="336" y="205.5" fill="#4a31bd">Directions</text></g><text x="20" y="256" fill="#14172a" font-size="15" font-weight="700">What we stock</text><text x="380" y="256" fill="#5b3fd9" font-size="11.5" font-weight="600" text-anchor="end">Full catalogue →</text><g><rect width="180" height="96" x="16" y="268" fill="#fff" stroke="#e4e1da" rx="14"/><rect width="34" height="26" x="32" y="284" fill="#efecfd" rx="5"/><rect width="22" height="8" x="38" y="279" fill="#5b3fd9" rx="3"/><text x="32" y="333" fill="#