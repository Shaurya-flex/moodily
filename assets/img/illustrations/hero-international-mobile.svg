<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>Illustrative demo: clear product page, short getting-started tutorial, then a walkthrough request</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1d1a3d" flood-opacity=".14"/></filter>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efecfd"/><stop offset="1" stop-color="#e4f5f7"/></linearGradient>
  </defs>
  <rect width="360" height="400" rx="22" fill="url(#bgg)"/>
  <path d="M40 128 V 142 M40 254 V 268" stroke="#5b3fd9" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round" opacity=".55"/>
  <!-- 1 -->
  <g filter="url(#sh)"><rect x="14" y="14" width="332" height="108" rx="14" fill="#fff"/></g>
  <circle cx="40" cy="40" r="13" fill="#5b3fd9"/><text x="40" y="45" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="62" y="36" font-size="10.5" font-weight="700" fill="#4a31bd" letter-spacing=".3">CLEAR PAGE</text>
  <text x="62" y="52" font-size="11" fill="#565d75">sampleapp.example</text>
  <text x="28" y="78" font-size="14.5" font-weight="700" fill="#14172a">Customer onboarding, explained clearly.</text>
  <g font-size="11.5" font-weight="600">
    <rect x="28" y="88" width="96" height="24" rx="12" fill="#5b3fd9"/><text x="76" y="104" fill="#fff" text-anchor="middle">See features</text>
    <rect x="132" y="88" width="100" height="24" rx="12" fill="#efecfd"/><text x="182" y="104" fill="#4a31bd" text-anchor="middle">How it works</text>
  </g>
  <!-- 2 -->
  <g filter="url(#sh)"><rect x="14" y="146" width="332" height="104" rx="14" fill="#fff"/></g>
  <circle cx="40" cy="172" r="13" fill="#5b3fd9"/><text x="40" y="177" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="62" y="168" font-size="10.5" font-weight="700" fill="#4a31bd" letter-spacing=".3">UNDERSTOOD</text>
  <text x="62" y="184" font-size="11" fill="#565d75">Getting started · 4 min tutorial · captions</text>
  <g font-size="12" fill="#14172a">
    <circle cx="36" cy="206" r="7" fill="#12795b"/><path d="M32.5 206l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="210">Create workspace</text>
    <circle cx="186" cy="206" r="7" fill="#12795b"/><path d="M182.5 206l2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="210">Invite your team</text>
    <rect x="26" y="220" width="308" height="22" rx="7" fill="#efecfd" stroke="#5b3fd9" stroke-width="1.3"/>
    <text x="36" y="235" font-weight="700">3  Track requests</text><text x="324" y="235" fill="#4a31bd" font-size="11" font-weight="600" text-anchor="end">Now playing</text>
  </g>
  <!-- 3 -->
  <g filter="url(#sh)"><rect x="14" y="274" width="332" height="96" rx="14" fill="#fff"/></g>
  <circle cx="40" cy="300" r="13" fill="#5b3fd9"/><text x="40" y="305" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="62" y="296" font-size="10.5" font-weight="700" fill="#4a31bd" letter-spacing=".3">READY TO ACT</text>
  <text x="62" y="312" font-size="11" fill="#565d75">Book a walkthrough · your time zone</text>
  <rect x="26" y="324" width="308" height="36" rx="9" fill="#e5f3ee"/>
  <circle cx="44" cy="342" r="8" fill="#12795b"/><path d="M40 342l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="346.5" font-size="12" fill="#12795b"><tspan font-weight="700">Request sent</tspan><tspan fill="#14172a"> — confirmed by email</tspan></text>
  <!-- label -->
  <rect x="226" y="378" width="122" height="16" rx="8" fill="#1d1a3d"/>
  <text x="287" y="389.5" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing=".4">ILLUSTRATIVE DEMO</text>
</svg>
