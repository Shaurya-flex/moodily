<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>Concept demo: a tutorial storyboard for a fictional app, with highlighted interface steps, captions, narration and chapters</title>
  <rect width="640" height="440" rx="24" fill="#1d1a3d"/>
  <text x="32" y="44" font-size="11" font-weight="700" fill="#cfcaf0" letter-spacing=".6">TUTORIAL STORYBOARD</text>
  <text x="32" y="68" font-size="17" font-weight="700" fill="#fff">Getting started with Sample App</text>
  <!-- frame helper: 3 frames -->
  <g>
    <rect x="32" y="88" width="184" height="150" rx="12" fill="#fff"/>
    <rect x="32" y="88" width="184" height="22" rx="12" fill="#f1efea"/><rect x="32" y="100" width="184" height="10" fill="#f1efea"/>
    <rect x="44" y="122" width="56" height="8" rx="4" fill="#d8d3c8"/><rect x="44" y="138" width="100" height="6" rx="3" fill="#e9e5dc"/><rect x="44" y="150" width="84" height="6" rx="3" fill="#e9e5dc"/>
    <rect x="116" y="178" width="84" height="26" rx="13" fill="#5b3fd9"/><text x="158" y="195" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">+ New project</text>
    <rect x="110" y="172" width="96" height="38" rx="19" fill="none" stroke="#ff7a36" stroke-width="3"/>
    <rect x="32" y="214" width="184" height="24" fill="#0b0f1a" opacity=".82"/>
    <text x="124" y="230" font-size="10.5" fill="#fff" text-anchor="middle">Click New project to start</text>
    
  </g>
  <g>
    <rect x="228" y="88" width="184" height="150" rx="12" fill="#fff"/>
    <rect x="228" y="88" width="184" height="22" rx="12" fill="#f1efea"/><rect x="228" y="100" width="184" height="10" fill="#f1efea"/>
    <text x="240" y="132" font-size="10" fill="#565d75">Project name</text>
    <rect x="240" y="138" width="160" height="22" rx="6" fill="#f7f6f3" stroke="#5b3fd9" stroke-width="1.5"/><text x="248" y="153" font-size="10" fill="#14172a">Spring launch</text>
    <g fill="#efecfd"><rect x="240" y="170" width="48" height="34" rx="6"/><rect x="296" y="170" width="48" height="34" rx="6"/><rect x="352" y="170" width="48" height="34" rx="6"/></g>
    <rect x="292" y="166" width="56" height="42" rx="8" fill="none" stroke="#ff7a36" stroke-width="3"/>
    <rect x="228" y="214" width="184" height="24" fill="#0b0f1a" opacity=".82"/>
    <text x="320" y="230" font-size="10.5" fill="#fff" text-anchor="middle">Name it and pick a template</text>
  </g>
  <g>
    <rect x="424" y="88" width="184" height="150" rx="12" fill="#fff"/>
    <rect x="424" y="88" width="184" height="22" rx="12" fill="#f1efea"/><rect x="424" y="100" width="184" height="10" fill="#f1efea"/>
    <circle cx="452" cy="138" r="10" fill="#e4f5f7"/><circle cx="476" cy="138" r="10" fill="#efecfd"/><circle cx="500" cy="138" r="10" fill="#fdf0e7"/>
    <rect x="440" y="158" width="150" height="20" rx="6" fill="#f7f6f3" stroke="#e4e1da"/><text x="448" y="172" font-size="9.5" fill="#565d75">teammate@company.example</text>
    <rect x="506" y="184" width="84" height="22" rx="11" fill="#0e7c8c"/><text x="548" y="199" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Send invite</text>
    <rect x="500" y="179" width="96" height="32" rx="16" fill="none" stroke="#ff7a36" stroke-width="3"/>
    <rect x="424" y="214" width="184" height="24" fill="#0b0f1a" opacity=".82"/>
    <text x="516" y="230" font-size="10.5" fill="#fff" text-anchor="middle">Invite your team</text>
  </g>
  <!-- step numbers -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="32" cy="88" r="12" fill="#ff7a36"/><text x="32" y="92" fill="#2a1204">1</text>
    <circle cx="228" cy="88" r="12" fill="#ff7a36"/><text x="228" y="92" fill="#2a1204">2</text>
    <circle cx="424" cy="88" r="12" fill="#ff7a36"/><text x="424" y="92" fill="#2a1204">3</text>
  </g>
  <!-- narration -->
  <text x="32" y="276" font-size="11" font-weight="700" fill="#cfcaf0" letter-spacing=".6">NARRATION</text>
  <g font-size="12" fill="#fff">
    <text x="32" y="300"><tspan fill="#22d3ee" font-weight="700">0:00</tspan>  In two minutes you'll have your first project set up.</text>
    <text x="32" y="322"><tspan fill="#22d3ee" font-weight="700">0:20</tspan>  Click New project, give it a name and choose a template.</text>
    <text x="32" y="344"><tspan fill="#22d3ee" font-weight="700">1:05</tspan>  Invite the people you work with — they get an email link.</text>
  </g>
  <!-- timeline -->
  <rect x="32" y="372" width="520" height="8" rx="4" fill="#2a2258"/>
  <rect x="32" y="372" width="196" height="8" rx="4" fill="#8b70ff"/>
  <g fill="#fff"><circle cx="32" cy="376" r="5"/><circle cx="132" cy="376" r="5"/><circle cx="330" cy="376" r="5"/></g>
  <g font-size="10.5" fill="#cfcaf0"><text x="32" y="400">Intro</text><text x="132" y="400">Create</text><text x="330" y="400">Invite</text><text x="552" y="400" text-anchor="end">1:45</text></g>
  <rect x="568" y="364" width="40" height="24" rx="5" fill="none" stroke="#cfcaf0" stroke-width="1.5"/><text x="588" y="380.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">CC</text>
  <!-- label -->
  <rect x="456" y="24" width="152" height="24" rx="12" fill="#ff7a36"/>
  <text x="532" y="40" font-size="10" font-weight="700" fill="#2a1204" text-anchor="middle" letter-spacing=".4">CONCEPT DEMO</text>
</svg>
