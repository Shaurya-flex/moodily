<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" viewBox="0 0 640 540"><title>Illustrative demo: a visitor reads a clear product page, follows a short getting-started tutorial, then requests a walkthrough</title><defs><filter id="sh" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#1d1a3d" flood-opacity=".14" stdDeviation="12"/></filter><linearGradient id="bgg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#efecfd"/><stop offset="1" stop-color="#e4f5f7"/></linearGradient></defs><rect width="624" height="524" x="8" y="8" fill="url(#bgg)" rx="28"/><path fill="none" stroke="#5b3fd9" stroke-dasharray="6 7" stroke-linecap="round" stroke-width="2.5" d="M282 222 C 284 238, 288 248, 292 254 M 352 348 C 352 392, 330 408, 294 410" opacity=".55"/><g filter="url(#sh)"><rect width="270" height="180" x="34" y="40" fill="#fff" rx="16"/></g><rect width="270" height="28" x="34" y="40" fill="#f1efea" rx="16"/><rect width="270" height="12" x="34" y="56" fill="#f1efea"/><circle cx="52" cy="54" r="4" fill="#d8d3c8"/><circle cx="64" cy="54" r="4" fill="#d8d3c8"/><circle cx="76" cy="54" r="4" fill="#d8d3c8"/><text x="200" y="58" fill="#565d75" font-size="10.5" text-anchor="middle">sampleapp.example</text><rect width="18" height="18" x="50" y="80" fill="#5b3fd9" rx="5"/><text x="76" y="94" fill="#14172a" font-size="12.5" font-weight="700">Sample App</text><text x="288" y="94" fill="#565d75" font-size="10" text-anchor="end">Features · Pricing · Docs</text><text x="50" y="124" fill="#14172a" font-size="15" font-weight="700">Customer onboarding,</text><text x="50" y="143" fill="#14172a" font-size="15" font-weight="700">explained clearly.</text><text x="50" y="162" fill="#565d75" font-size="11">Set up in minutes with a guided tour.</text><g font-size="11" font-weight="600"><rect width="92" height="28" x="50" y="176" fill="#5b3fd9" rx="14"/><text x="96" y="194" fill="#fff" text-anchor="middle">See features</text><rect width="96" height="28" x="150" y="176" fill="#efecfd" rx="14"/><text x="198" y="194" fill="#4a31bd" text-anchor="middle">How it works</text></g><g><circle cx="304" cy="40" r="17" fill="#5b3fd9"/><text x="304" y="45.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text></g><text x="34" y="242" fill="#565d75" font-size="12.5"><tspan fill="#1d1a3d" font-weight="700">Clear page</tspan> — visitors know what it does</text><g filter="url(#sh)"><rect width="312" height="214" x="292" y="132" fill="#fff" rx="16"/></g><rect width="312" height="44" x="292" y="132" fill="#1d1a3d" rx="16"/><rect width="312" height="16" x="292" y="160" fill="#1d1a3d"/><text x="310" y="159" fill="#fff" font-size="13" font-weight="700">Getting started</text><text x="586" y="159" fill="#cfcaf0" font-size="11" text-anchor="end">3 steps · 4 min tutorial</text><g fill="#14172a" font-size="12"><rect width="276" height="34" x="310" y="190" fill="#f7f6f3" rx="9"/><circle cx="328" cy="207" r="8" fill="#12795b"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M324 207l3 3 5-6"/><text x="344" y="211">Create workspace</text><text x="572" y="211" fill="#565d75" text-anchor="end">0:20</text><rect width="276" height="34" x="310" y="230" fill="#f7f6f3" rx="9"/><circle cx="328" cy="247" r="8" fill="#12795b"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M324 247l3 3 5-6"/><text x="344" y="251">Invite your team</text><text x="572" y="251" fill="#565d75" text-anchor="end">1:05</text><rect width="276" height="34" x="310" y="270" fill="#efecfd" stroke="#5b3fd9" stroke-width="1.5" rx="9"/><circle cx="328" cy="287" r="8" fill="#5b3fd9"/><text x="328" y="291" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">3</text><text x="344" y="291" font-weight="700">Track requests</text><text x="572" y="291" fill="#4a31bd" font-weight="600" text-anchor="end">Now playing</text></g><rect width="58" height="20" x="310" y="314" fill="none" stroke="#565d75" rx="5"/><text x="339" y="328" fill="#565d75" font-size="10" font-weight="700" text-anchor="middle">CC</text><text x="378" y="328" fill="#565d75" font-size="10.5">Captions and chapters</text><g><circle cx="604" cy="132" r="17" fill="#5b3fd9"/><text x="604" y="137.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text></g><text x="604" y="368" fill="#565d75" font-size="12.5" text-anchor="end"><tspan fill="#1d1a3d" font-weight="700">Understood</tspan> — steps are easy to follow</text><g filter="url(#sh)"><rect width="258" height="196" x="34" y="300" fill="#fff" rx="16"/></g><text x="52" y="330" fill="#14172a" font-size="14" font-weight="700">Book a walkthrough</text><g font-size="11"><text x="52" y="352" fill="#565d75">Pick a time (your time zone)</text><rect width="106" height="28" x="52" y="358" fill="#efecfd" stroke="#5b3fd9" stroke-width="1.5" rx="8"/><text x="105" y="376" fill="#4a31bd" font-weight="700" text-anchor="middle">Tue · 10:00</text><rect width="106" height="28" x="168" y="358" fill="#f7f6f3" stroke="#e4e1da" rx="8"/><text x="221" y="376" fill="#14172a" text-anchor="middle">Thu · 15:30</text></g><rect width="222" height="58" x="52" y="398" fill="#e5f3ee" rx="10"/><circle cx="70" cy="418" r="8" fill="#12795b"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M66 418l3 3 5-6"/><text x="86" y="422" fill="#12795b" font-size="12" font-weight="700">Request sent</text><text x="66" y="443" fill="#14172a" font-size="10.5">The team confirms the time by email.</text><text x="52" y="478" fill="#565d75" font-size="10.5">Or ask a question — no sales call needed.</text><g><circle cx="292" cy="300" r="17" fill="#5b3fd9"/><text x="292" y="305.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text></g><text x="312" y="446" fill="#565d75" font-size="12.5"><tspan fill="#1d1a3d" font-weight="700">Ready to act</tspan> — one clear next step</text><rect width="160" height="28" x="452" y="488" fill="#1d1a3d" rx="14"/><text x="532" y="506.5" fill="#fff" font-size="11.5" font-weight="700" letter-spacing=".4" text-anchor="middle">ILLUSTRATIVE DEMO</text></svg>