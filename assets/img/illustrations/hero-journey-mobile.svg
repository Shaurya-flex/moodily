<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" viewBox="0 0 360 400"><title>Illustrative demo: a customer finds a fictional optician, reads a clear service page, then sends an eye-test request</title><defs><filter id="sh" width="120%" height="140%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#1d1a3d" flood-opacity=".14" stdDeviation="8"/></filter><linearGradient id="bgg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#efecfd"/><stop offset="1" stop-color="#e4f5f7"/></linearGradient></defs><rect width="360" height="400" fill="url(#bgg)" rx="22"/><path stroke="#5b3fd9" stroke-dasharray="5 6" stroke-linecap="round" stroke-width="2.5" d="M40 128 V 142 M40 254 V 268" opacity=".55"/><g filter="url(#sh)"><rect width="332" height="108" x="14" y="14" fill="#fff" rx="14"/></g><circle cx="40" cy="40" r="13" fill="#5b3fd9"/><text x="40" y="45" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="62" y="36" fill="#4a31bd" font-size="10.5" font-weight="700" letter-spacing=".3">FOUND</text><text x="62" y="52" fill="#565d75" font-size="11">“opticians near me”</text><text x="28" y="76" fill="#14172a" font-size="14.5" font-weight="700">Kaveri Opticals</text><circle cx="176" cy="72" r="3.5" fill="#12795b"/><text x="184" y="76" fill="#12795b" font-size="11.5" font-weight="600">Open until 8 pm</text><g font-size="11.5" font-weight="600"><rect width="62" height="24" x="28" y="88" fill="#5b3fd9" rx="12"/><text x="59" y="104" fill="#fff" text-anchor="middle">Call</text><rect width="86" height="24" x="98" y="88" fill="#efecfd" rx="12"/><text x="141" y="104" fill="#4a31bd" text-anchor="middle">Directions</text><rect width="78" height="24" x="192" y="88" fill="#efecfd" rx="12"/><text x="231" y="104" fill="#4a31bd" text-anchor="middle">Website</text></g><g filter="url(#sh)"><rect width="332" height="104" x="14" y="146" fill="#fff" rx="14"/></g><circle cx="40" cy="172" r="13" fill="#5b3fd9"/><text x="40" y="177" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="62" y="168" fill="#4a31bd" font-size="10.5" font-weight="700" letter-spacing=".3">UNDERSTOOD</text><text x="62" y="184" fill="#565d75" font-size="11">Service page · Mon–Sat, 10–8</text><g fill="#14172a" font-size="12"><rect width="308" height="20" x="26" y="196" fill="#f7f6f3" rx="6"/><text x="36" y="210">Eye test</text><text x="324" y="210" fill="#565d75" text-anchor="end">20 minutes</text><rect width="308" height="20" x="26" y="222" fill="#f7f6f3" rx="6"/><text x="36" y="236">Frames and lenses</text><text x="324" y="236" fill="#565d75" text-anchor="end">Ready in 2–3 days</text></g><g filter="url(#sh)"><rect width="332" height="96" x="14" y="274" fill="#fff" rx="14"/></g><circle cx="40" cy="300" r="13" fill="#5b3fd9"/><text x="40" y="305" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="62" y="296" fill="#4a31bd" font-size="10.5" font-weight="700" letter-spacing=".3">CONTACTED</text><text x="62" y="312" fill="#565d75" font-size="11">Request an eye test · Saturday morning</text><rect width="308" height="36" x="26" y="324" fill="#e5f3ee" rx="9"/><circle cx="44" cy="342" r="8" fill="#12795b"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M40 342l3 3 5-6"/><text x="58" y="346.5" fill="#12795b" font-size="12"><tspan font-weight="700">Request sent</tspan><tspan fill="#14172a"> — shop confirms on WhatsApp</tspan></text><rect width="122" height="16" x="226" y="378" fill="#1d1a3d" rx="8"/><text x="287" y="389.5" fill="#fff" font-size="8.5" font-weight="700" letter-spacing=".4" text-anchor="middle">ILLUSTRATIVE DEMO</text></svg>