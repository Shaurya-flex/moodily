<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>Concept demo: a fictional dental clinic page with services and two clearly separated appointment options</title>
  <defs><filter id="d" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d1a3d" flood-opacity=".12"/></filter></defs>
  <rect width="640" height="440" rx="24" fill="#e4f5f7"/>
  <g filter="url(#d)"><rect x="24" y="22" width="592" height="396" rx="16" fill="#fff"/></g>
  <!-- browser bar -->
  <rect x="24" y="22" width="592" height="38" rx="16" fill="#f1efea"/><rect x="24" y="44" width="592" height="16" fill="#f1efea"/>
  <circle cx="46" cy="41" r="5" fill="#d8d3c8"/><circle cx="62" cy="41" r="5" fill="#d8d3c8"/><circle cx="78" cy="41" r="5" fill="#d8d3c8"/>
  <rect x="206" y="30" width="228" height="22" rx="11" fill="#fff"/><text x="320" y="45.5" font-size="11" fill="#565d75" text-anchor="middle">northfield-dental.example</text>
  <!-- nav -->
  <circle cx="54" cy="86" r="11" fill="#0e7c8c"/><path d="M49 82c2-3 8-3 10 0-1 6-2 10-3 10s-1-4-2-4-1 4-2 4-1-4-3-10z" fill="#fff"/>
  <text x="72" y="91" font-size="14" font-weight="700" fill="#14172a">Northfield Dental Studio</text>
  <text x="600" y="91" font-size="11.5" fill="#565d75" text-anchor="end">Services · New patients · Fees · Find us</text>
  <line x1="24" y1="108" x2="616" y2="108" stroke="#e4e1da"/>
  <!-- hero copy -->
  <text x="44" y="146" font-size="21" font-weight="700" fill="#14172a">Check-ups, cleaning</text>
  <text x="44" y="172" font-size="21" font-weight="700" fill="#14172a">and urgent care</text>
  <text x="44" y="196" font-size="12" fill="#565d75">New and existing patients welcome.</text>
  <!-- services -->
  <g font-size="12.5">
    <rect x="44" y="214" width="290" height="46" rx="10" fill="#f7f6f3"/><text x="60" y="242" font-weight="700" fill="#14172a">Check-up and clean</text><text x="318" y="242" fill="#565d75" text-anchor="end">45 min</text>
    <rect x="44" y="268" width="290" height="46" rx="10" fill="#f7f6f3"/><text x="60" y="296" font-weight="700" fill="#14172a">Whitening consultation</text><text x="318" y="296" fill="#565d75" text-anchor="end">30 min</text>
    <rect x="44" y="322" width="290" height="46" rx="10" fill="#f7f6f3"/><text x="60" y="350" font-weight="700" fill="#14172a">Urgent appointment</text><text x="318" y="350" fill="#565d75" text-anchor="end">Same week</text>
  </g>
  <text x="44" y="394" font-size="11" fill="#565d75">Clinic-approved answers to common questions.</text>
  <!-- appointment panel -->
  <rect x="356" y="128" width="240" height="250" rx="14" fill="#1d1a3d"/>
  <text x="374" y="158" font-size="15" font-weight="700" fill="#fff">Appointments</text>
  <rect x="374" y="172" width="204" height="40" rx="20" fill="#8b70ff"/><text x="476" y="197" font-size="12.5" font-weight="700" fill="#0a0716" text-anchor="middle">Book online</text>
  <text x="374" y="230" font-size="10.5" fill="#cfcaf0">Opens the clinic's own booking system.</text>
  <line x1="374" y1="246" x2="578" y2="246" stroke="#3a3470"/>
  <rect x="374" y="260" width="204" height="40" rx="20" fill="none" stroke="#cfcaf0"/><text x="476" y="285" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Request a call back</text>
  <text x="374" y="318" font-size="10.5" fill="#cfcaf0">We call you to agree a time.</text>
  <text x="374" y="334" font-size="10.5" font-weight="700" fill="#fff">A request is not a confirmed booking.</text>
  <rect x="374" y="342" width="204" height="26" rx="8" fill="#2a2258"/>
  <text x="384" y="359" font-size="9.5" fill="#cfcaf0">Please don't send medical details here.</text>
  <!-- label -->
  <rect x="446" y="386" width="150" height="24" rx="12" fill="#0e7c8c"/>
  <text x="521" y="402" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing=".4">CONCEPT DEMO</text>
</svg>
