<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" viewBox="0 0 640 440"><title>Concept demo: a fictional dental clinic page with services and two clearly separated appointment options</title><defs><filter id="d" width="110%" height="120%" x="-5%" y="-5%"><feDropShadow dx="0" dy="8" flood-color="#1d1a3d" flood-opacity=".12" stdDeviation="10"/></filter></defs><rect width="640" height="440" fill="#e4f5f7" rx="24"/><g filter="url(#d)"><rect width="592" height="396" x="24" y="22" fill="#fff" rx="16"/></g><rect width="592" height="38" x="24" y="22" fill="#f1efea" rx="16"/><rect width="592" height="16" x="24" y="44" fill="#f1efea"/><circle cx="46" cy="41" r="5" fill="#d8d3c8"/><circle cx="62" cy="41" r="5" fill="#d8d3c8"/><circle cx="78" cy="41" r="5" fill="#d8d3c8"/><rect width="228" height="22" x="206" y="30" fill="#fff" rx="11"/><text x="320" y="45.5" fill="#565d75" font-size="11" text-anchor="middle">northfield-dental.example</text><circle cx="54" cy="86" r="11" fill="#0e7c8c"/><path fill="#fff" d="M49 82c2-3 8-3 10 0-1 6-2 10-3 10s-1-4-2-4-1 4-2 4-1-4-3-10z"/><text x="72" y="91" fill="#14172a" font-size="14" font-weight="700">Northfield Dental Studio</text><text x="600" y="91" fill="#565d75" font-size="11.5" text-anchor="end">Services · New patients · Fees · Find us</text><line x1="24" x2="616" y1="108" y2="108" stroke="#e4e1da"/><text x="44" y="146" fill="#14172a" font-size="21" font-weight="700">Check-ups, cleaning</text><text x="44" y="172" fill="#14172a" font-size="21" font-weight="700">and urgent care</text><text x="44" y="196" fill="#565d75" font-size="12">New and existing patients welcome.</text><g font-size="12.5"><rect width="290" height="46" x="44" y="214" fill="#f7f6f3" rx="10"/><text x="60" y="242" fill="#14172a" font-weight="700">Check-up and clean</text><text x="318" y="242" fill="#565d75" text-anchor="end">45 min</text><rect width="290" height="46" x="44" y="268" fill="#f7f6f3" rx="10"/><text x="60" y="296" fill="#14172a" font-weight="700">Whitening consultation</text><text x="318" y="296" fill="#565d75" text-anchor="end">30 min</text><rect width="290" height="46" x="44" y="322" fill="#f7f6f3" rx="10"/><text x="60" y="350" fill="#14172a" font-weight="700">Urgent appointment</text><text x="318" y="350" fill="#565d75" text-anchor="end">Same week</text></g><text x="44" y="394" fill="#565d75" font-size="11">Clinic-approved answers to common questions.</text><rect width="240" height="250" x="356" y="128" fill="#1d1a3d" rx="14"/><text x="374" y="158" fill="#fff" font-size="15" font-weight="700">Appointments</text><rect width="204" height="40" x="374" y="172" fill="#8b70ff" rx="20"/><text x="476" y="197" fill="#0a0716" font-size="12.5" font-weight="700" text-anchor="middle">Book online</text><text x="374" y="230" fill="#cfcaf0" font-size="10.5">Opens the clinic&apos;s own booking system.</text><line x1="374" x2="578" y1="246" y2="246" stroke="#3a3470"/><rect width="204" height="40" x="374" y="260" fill="none" stroke="#cfcaf0" rx="20"/><text x="476" y="285" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">Request a call back</text><text x="374" y="318" fill="#cfcaf0" font-size="10.5">We call you to agree a time.</text><text x="374" y="334" fill="#fff" font-size="10.5" font-weight="700">A request is not a confirmed booking.</text><rect width="204" height="26" x="374" y="342" fill="#2a2258" rx="8"/><text x="384" y="359" fill="#cfcaf0" font-size="9.5">Please don&apos;t send medical details here.</text><rect width="150" height="24" x="446" y="386" fill="#0e7c8c" rx="12"/><text x="521" y="402" fill="#fff" font-size="10" font-weight="700" letter-spacing=".4" text-anchor="middle">CONCEPT DEMO</text></svg>