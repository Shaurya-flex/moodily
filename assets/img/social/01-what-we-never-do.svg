<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Noto Sans Devanagari','Kohinoor Devanagari','Devanagari Sangam MN',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><title>जो हम कभी नहीं करेंगे</title><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#f7f6f3"/><text x="76" y="89.6" font-size="40" fill="#14172a" font-weight="800" text-anchor="start">moodily</text><circle cx="248" cy="74" r="7" fill="#d95f1e"/><text x="268" y="85.84" font-size="26" fill="#565d75" font-weight="400" text-anchor="start">moodily.in</text><text x="76" y="227.76" font-size="64" fill="#14172a" font-weight="800" text-anchor="start">जो हम कभी नहीं करेंगे</text><text x="76" y="303.99999999999994" font-size="30" fill="#565d75" font-weight="400" text-anchor="start">कीमत बताने से पहले यह जान लीजिए।</text><text x="84" y="397.35999999999996" font-size="34" fill="#b23b2b" font-weight="700" text-anchor="start">✕</text><text x="138" y="396.52" font-size="33" fill="#14172a" font-weight="500" text-anchor="start">Google पर पहले नंबर की guarantee — कोई भी</text><text x="138" y="444.7" font-size="33" fill="#14172a" font-weight="500" text-anchor="start">ईमानदार agency नहीं दे सकती</text><text x="84" y="541.1399999999999" font-size="34" fill="#b23b2b" font-weight="700" text-anchor="start">✕</text><text x="138" y="540.3" font-size="33" fill="#14172a" font-weight="500" text-anchor="start">नकली या ख़रीदे हुए reviews</text><text x="84" y="636.7399999999999" font-size="34" fill="#b23b2b" font-weight="700" text-anchor="start">✕</text><text x="138" y="635.9" font-size="33" fill="#14172a" font-weight="500" text-anchor="start">आपके accounts की ownership — वे आपके ही नाम</text><text x="138" y="684.0799999999999" font-size="33" fill="#14172a" font-weight="500" text-anchor="start">पर रहते हैं</text><text x="84" y="780.5199999999999" font-size="34" fill="#b23b2b" font-weight="700" text-anchor="start">✕</text><text x="138" y="779.68" font-size="33" fill="#14172a" font-weight="500" text-anchor="start">छुपी हुई fees — हर काम का scope और price</text><text x="138" y="827.8599999999999" font-size="33" fill="#14172a" font-weight="500" text-anchor="start">लिखित में</text><rect x="76" y="900" width="928" height="140" rx="20" fill="#eef7f2"/><text x="110" y="948.36" font-size="29" fill="#12795b" font-weight="600" text-anchor="start">जो करेंगे: आपकी जानकारी Google, WhatsApp और</text><text x="110" y="990.7" font-size="29" fill="#12795b" font-weight="600" text-anchor="start">website पर पूरी, सही और अपडेटेड रखना.</text><rect x="76" y="1140" width="928" height="2" rx="0" fill="#e4e1da"/><text x="76" y="1204.24" font-size="36" fill="#14172a" font-weight="700" text-anchor="start">मुफ़्त Digital Audit — WhatsApp पर</text><text x="76" y="1253.0" font-size="25" fill="#565d75" font-weight="400" text-anchor="start">Google · WhatsApp · Website · Catalogue — साफ़ price, लिखित scope</text></svg>