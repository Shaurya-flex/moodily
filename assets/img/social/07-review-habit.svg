<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Noto Sans Devanagari','Kohinoor Devanagari','Devanagari Sangam MN',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><title>34% — जो लोग Google पर किसी दुकान का पता या नंबर देखते हैं, उनमें </title><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#f7f6f3"/><text x="76" y="89.6" font-size="40" fill="#14172a" font-weight="800" text-anchor="start">moodily</text><circle cx="248" cy="74" r="7" fill="#d95f1e"/><text x="268" y="85.84" font-size="26" fill="#565d75" font-weight="400" text-anchor="start">moodily.in</text><text x="76" y="203.52" font-size="28" fill="#d95f1e" font-weight="700" text-anchor="start">आपका ग्राहक कहाँ है</text><text x="76" y="373.6" font-size="150" fill="#5b3fd9" font-weight="800" text-anchor="start">34%</text><text x="76" y="479.52000000000004" font-size="38" fill="#14172a" font-weight="700" text-anchor="start">जो लोग Google पर किसी दुकान का पता या</text><text x="76" y="535.0" font-size="38" fill="#14172a" font-weight="700" text-anchor="start">नंबर देखते हैं, उनमें इतने हमेशा या</text><text x="76" y="590.48" font-size="38" fill="#14172a" font-weight="700" text-anchor="start">ज़्यादातर बार reviews भी पढ़ते हैं।</text><text x="76" y="662.52" font-size="29" fill="#565d75" font-weight="400" text-anchor="start">12% “हमेशा” + 22% “ज़्यादातर बार”। कभी-न-कभी पढ़ने</text><text x="76" y="704.86" font-size="29" fill="#565d75" font-weight="400" text-anchor="start">वाले 88% हैं। 56,000+ जवाब, 357 ज़िले (20% tier 3/4</text><text x="76" y="747.1999999999999" font-size="29" fill="#565d75" font-weight="400" text-anchor="start">और ग्रामीण)।</text><rect x="76" y="801.64" width="928" height="5" rx="0" fill="#d95f1e"/><text x="76" y="877.56" font-size="38" fill="#14172a" font-weight="600" text-anchor="start">वे आपका नंबर ढूँढते-ढूँढते reviews भी</text><text x="76" y="933.04" font-size="38" fill="#14172a" font-weight="600" text-anchor="start">पढ़ लेते हैं — एक ही स्क्रीन पर।</text><text x="76" y="1097.32" font-size="23" fill="#565d75" font-weight="400" text-anchor="start">Source: LocalCircles · 2022</text><rect x="76" y="1140" width="928" height="2" rx="0" fill="#e4e1da"/><text x="76" y="1204.24" font-size="36" fill="#14172a" font-weight="700" text-anchor="start">मुफ़्त Digital Audit — WhatsApp पर</text><text x="76" y="1253.0" font-size="25" fill="#565d75" font-weight="400" text-anchor="start">Google · WhatsApp · Website · Catalogue — साफ़ price, लिखित scope</text></svg>