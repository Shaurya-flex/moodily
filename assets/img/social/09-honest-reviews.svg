<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Noto Sans Devanagari','Kohinoor Devanagari','Devanagari Sangam MN',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><title>केवल 3% को Google reviews पर ऊँचा भरोसा</title><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#1d1a3d"/><text x="76" y="89.6" font-size="40" fill="#ffffff" font-weight="800" text-anchor="start">moodily</text><circle cx="248" cy="74" r="7" fill="#d95f1e"/><text x="268" y="85.84" font-size="26" fill="#cfcaf0" font-weight="400" text-anchor="start">moodily.in</text><text x="76" y="227.04" font-size="56" fill="#ffffff" font-weight="800" text-anchor="start">हम आपको आधी तस्वीर</text><text x="76" y="308.79999999999995" font-size="56" fill="#ffffff" font-weight="800" text-anchor="start">नहीं दिखाएँगे</text><text x="76" y="486.55999999999995" font-size="140" fill="#d95f1e" font-weight="800" text-anchor="start">3%</text><text x="76" y="584.24" font-size="42" fill="#ffffff" font-weight="700" text-anchor="start">भारतीयों को ही Google reviews पर</text><text x="76" y="645.5600000000001" font-size="42" fill="#ffffff" font-weight="700" text-anchor="start">ऊँचा भरोसा है।</text><text x="76" y="719.0400000000001" font-size="29" fill="#cfcaf0" font-weight="400" text-anchor="start">45% को लगता है reviews सही नहीं होतीं, 37% को लगता है</text><text x="76" y="761.3800000000001" font-size="29" fill="#cfcaf0" font-weight="400" text-anchor="start">वे positively biased हैं।</text><rect x="76" y="815.8200000000002" width="928" height="5" rx="0" fill="#d95f1e"/><text x="76" y="894.0600000000002" font-size="36" fill="#ffffff" font-weight="600" text-anchor="start">इसलिए नकली review का कोई फ़ायदा नहीं।</text><text x="76" y="946.6200000000001" font-size="36" fill="#ffffff" font-weight="600" text-anchor="start">असली, पूरी और अपडेटेड जानकारी ही भरोसा</text><text x="76" y="999.1800000000002" font-size="36" fill="#ffffff" font-weight="600" text-anchor="start">बनाती है।</text><text x="76" y="1097.32" font-size="23" fill="#cfcaf0" font-weight="400" text-anchor="start">Source: LocalCircles · 2022 · 56,000+ जवाब, 357 ज़िले</text><rect x="76" y="1140" width="928" height="2" rx="0" fill="#ffffff22"/><text x="76" y="1204.24" font-size="36" fill="#ffffff" font-weight="700" text-anchor="start">मुफ़्त Digital Audit — WhatsApp पर</text><text x="76" y="1253.0" font-size="25" fill="#cfcaf0" font-weight="400" text-anchor="start">Google · WhatsApp · Website · Catalogue — साफ़ price, लिखित scope</text></svg>