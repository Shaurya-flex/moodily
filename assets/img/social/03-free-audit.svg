<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Noto Sans Devanagari','Kohinoor Devanagari','Devanagari Sangam MN',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><title>मुफ़्त Digital Audit — चार कदम</title><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#f7f6f3"/><text x="76" y="89.6" font-size="40" fill="#14172a" font-weight="800" text-anchor="start">moodily</text><circle cx="248" cy="74" r="7" fill="#d95f1e"/><text x="268" y="85.84" font-size="26" fill="#565d75" font-weight="400" text-anchor="start">moodily.in</text><text x="76" y="224.4" font-size="60" fill="#14172a" font-weight="800" text-anchor="start">पहले मुफ़्त Digital</text><text x="76" y="312.0" font-size="60" fill="#14172a" font-weight="800" text-anchor="start">Audit. फिर आप तय कीजिए.</text><text x="76" y="390.48" font-size="32" fill="#565d75" font-weight="400" text-anchor="start">हम आपका Google, WhatsApp, website और social</text><text x="76" y="437.20000000000005" font-size="32" fill="#565d75" font-weight="400" text-anchor="start">देखकर बताते हैं कि सबसे पहले क्या ठीक</text><text x="76" y="483.92" font-size="32" fill="#565d75" font-weight="400" text-anchor="start">करना चाहिए।</text><circle cx="110" cy="575.44" r="34" fill="#5b3fd9"/><text x="110" y="587.6800000000001" font-size="36" fill="#ffffff" font-weight="800" text-anchor="middle">1</text><text x="172" y="578.32" font-size="32" fill="#14172a" font-weight="500" text-anchor="start">आप business बताइए — WhatsApp पर</text><circle cx="110" cy="675.44" r="34" fill="#5b3fd9"/><text x="110" y="687.6800000000001" font-size="36" fill="#ffffff" font-weight="800" text-anchor="middle">2</text><text x="172" y="678.32" font-size="32" fill="#14172a" font-weight="500" text-anchor="start">हम जाँच करके 3 सबसे ज़रूरी सुधार बताते हैं</text><circle cx="110" cy="775.44" r="34" fill="#5b3fd9"/><text x="110" y="787.6800000000001" font-size="36" fill="#ffffff" font-weight="800" text-anchor="middle">3</text><text x="172" y="778.32" font-size="32" fill="#14172a" font-weight="500" text-anchor="start">हर सुधार पर: ख़ुद कर सकते हैं / हम मदद करें</text><circle cx="110" cy="875.44" r="34" fill="#5b3fd9"/><text x="110" y="887.6800000000001" font-size="36" fill="#ffffff" font-weight="800" text-anchor="middle">4</text><text x="172" y="878.32" font-size="32" fill="#14172a" font-weight="500" text-anchor="start">आगे काम करवाना है या नहीं — आपकी मर्ज़ी</text><rect x="76" y="974" width="928" height="66" rx="20" fill="#efecfd"/><text x="110" y="1024.88" font-size="32" fill="#5b3fd9" font-weight="600" text-anchor="start">मुफ़्त है. उसके बाद कुछ ख़रीदना ज़रूरी नहीं.</text><rect x="76" y="1140" width="928" height="2" rx="0" fill="#e4e1da"/><text x="76" y="1204.24" font-size="36" fill="#14172a" font-weight="700" text-anchor="start">मुफ़्त Digital Audit — WhatsApp पर</text><text x="76" y="1253.0" font-size="25" fill="#565d75" font-weight="400" text-anchor="start">Google · WhatsApp · Website · Catalogue — साफ़ price, लिखित scope</text></svg>