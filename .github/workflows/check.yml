name: Build & check site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Secret scan (no Razorpay key or .env file may enter the repo)
        run: python scripts/secret_scan.py
      - name: Build
        run: python build.py
      - name: Generated HTML must be committed
        run: |
          # sitemap lastmod and OWNER-TODO carry the build date, so they may legitimately differ.
          changed="$(git status --porcelain -- . ':(exclude)_project/OWNER-TODO.md' ':(exclude)sitemap.xml')"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "Run python3 build.py and commit the output"
            exit 1
          fi
      - name: Site checks
        run: python tests/check_site.py
      - name: Payments API tests (Python dev server)
        run: python tests/test_payments.py
      - name: Payments API tests (Cloudflare Worker)
        run: node --test tests/worker.test.mjs
